<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keepsafe — offline unlocker</title>
<style>
:root{--paper:#f4f3ef;--ink:#141413;--muted:#6d6a62;--rule:#d9d5cb;--accent:#a8341f;--field:#fffefb;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
@media(prefers-color-scheme:dark){:root{--paper:#131312;--ink:#e9e6df;--muted:#918d84;--rule:#302f2c;--accent:#e0705a;--field:#1b1b19}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);padding:0 20px 80px}
main{max-width:640px;margin:0 auto;padding-top:64px}
h1{font-size:30px;font-weight:600;letter-spacing:-.015em;margin:0}
h2{font-size:20px;font-weight:600;margin:0}
h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.standfirst{color:var(--muted);margin:10px 0 40px;max-width:48ch}
label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:2px;padding:10px 12px}
input[type=number]{font-family:var(--mono);width:130px}
input:focus{outline:2px solid var(--ink);outline-offset:-1px}
.btn{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--ink);padding:8px 16px;border-radius:2px;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--paper)}
.solid{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:18px}
.err{color:var(--accent);font-size:14px;margin:14px 0 0}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0;max-width:60ch}
.tt{font-family:var(--mono);font-size:.94em}
ul{list-style:none;margin:34px 0 0;padding:0;border-top:1px solid var(--rule)}
li{border-bottom:1px solid var(--rule);padding:16px 0;display:flex;gap:16px;justify-content:space-between;align-items:baseline}
ol{margin:22px 0 26px;padding-left:20px;font-size:15px;color:var(--muted)}
ol li{display:list-item;border:0;padding:0;margin-bottom:10px}
.name{font-size:17px}
.meta{display:block;font:12px/1.4 var(--mono);color:var(--muted);margin-top:5px}
.state{font:12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:var(--muted)}
pre{font:14px/1.85 var(--mono);background:var(--field);border:1px solid var(--rule);padding:16px;white-space:pre;overflow-x:auto;letter-spacing:.22em;user-select:none;margin:0 0 16px}
.code{font-family:var(--mono);font-size:clamp(24px,7vw,34px);word-break:break-all;background:var(--field);border:1px solid var(--ink);padding:20px;margin:0}
.gauge{font-family:var(--mono);font-size:clamp(28px,8vw,40px);margin:0;font-variant-numeric:tabular-nums}
.dial{font-family:var(--mono);font-size:clamp(96px,30vw,180px);line-height:1;margin:30px 0 0;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.dial.del{font-size:clamp(44px,13vw,84px);color:var(--accent);margin-top:56px}
.dial-label{font:12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 30px}
.track{height:1px;background:var(--rule);margin:34px 0 0}
.track span{display:block;height:1px;background:var(--ink)}
section{margin-top:34px;border-top:1px solid var(--rule);padding-top:22px}
.back{background:none;border:0;font:inherit;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:0}
</style>
</head>
<body>
<main>
  <h1>Keepsafe</h1>
  <p class="standfirst" id="lede">Offline unlocker. This single file holds your vault and everything needed to open it — no internet, no website.</p>

  <div id="pick" hidden>
    <label for="file">Vault file</label>
    <input id="file" type="file" accept="application/json,.json">
    <p class="hint">Choose the <span class="tt">keepsafe-vault-….json</span> you downloaded.</p>
  </div>

  <form id="gate" hidden autocomplete="off">
    <label for="pw">Password</label>
    <input id="pw" type="password" required autocomplete="current-password">
    <div class="row"><button class="btn solid" type="submit">Open</button></div>
    <p class="err" id="gate-err" hidden>Wrong password.</p>
  </form>

  <div id="list" hidden></div>
  <div id="detail" hidden></div>
</main>

<script>
var EMBEDDED = null; // __KEEPSAFE_EMBED__

(function () {
'use strict';
var $ = function (s) { return document.querySelector(s); };
var te = new TextEncoder(), td = new TextDecoder();
var vault = EMBEDDED, payload = null, seen = 0, solved = {}, runs = {};

function unb64(str){var b=atob(str),o=new Uint8Array(b.length);for(var i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function now(){return Math.max(Date.now(), seen);}

function deriveKey(secret, salt, it) {
  return crypto.subtle.importKey('raw', te.encode(secret), 'PBKDF2', false, ['deriveKey'])
    .then(function (base) {
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:it,hash:'SHA-256'},
        base, {name:'AES-GCM',length:256}, false, ['encrypt','decrypt']);
    });
}
function openBlob(key, blob) {
  return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(blob.iv)}, key, unb64(blob.ct))
    .then(function (pt) { return td.decode(pt); });
}

function countdown(ms){
  if(ms<=0)return '00:00:00';
  var s=Math.floor(ms/1000),d=Math.floor(s/86400);
  var pad=function(n){return String(n).padStart(2,'0');};
  return (d?d+'d ':'')+pad(Math.floor(s%86400/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);
}
function stamp(ms){return new Date(ms).toLocaleString([], {year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'});}

/* ── dictation: one digit at a time, decoys mixed in ─────────── */

function replay(steps){var b=[];steps.forEach(function(s){s.act==='del'?b.pop():b.push(s.ch);});return b.join('');}
function overfills(steps,len){var n=0;for(var i=0;i<steps.length;i++){n+=steps[i].act==='del'?-1:1;if(n>=len&&i<steps.length-1)return true;}return false;}

function draft(code){
  var digits=code.split(''), L=digits.length, numeric=/^\d+$/.test(code);
  var pool = numeric ? '0123456789' : 'abcdefghijklmnopqrstuvwxyz0123456789';
  var wrongFor=function(right){var c;do{c=pool[Math.floor(Math.random()*pool.length)];}while(c===right);return c;};
  var steps=[],buf=[],noise=L+1,guard=0;
  var onTrack=function(){return buf.every(function(c,i){return c===digits[i];});};
  while(guard++<400){
    if(!onTrack()){steps.push({act:'del'});buf.pop();continue;}
    if(buf.length===L-1&&noise<=0){steps.push({act:'type',ch:digits[L-1]});buf.push(digits[L-1]);break;}
    var room=buf.length<L-1;
    var beNoisy=noise>0&&(!room||Math.random()<0.5);
    if(beNoisy&&room&&(buf.length===0||Math.random()<0.6)){
      var w=wrongFor(digits[buf.length]);steps.push({act:'type',ch:w});buf.push(w);noise--;
    } else if(beNoisy&&buf.length>0){
      steps.push({act:'del'});buf.pop();noise--;
    } else {
      steps.push({act:'type',ch:digits[buf.length]});buf.push(digits[buf.length]);
    }
  }
  return steps;
}

function dictation(code){
  if(code.length<2) return code.split('').map(function(ch){return {act:'type',ch:ch};});
  for(var i=0;i<25;i++){var s=draft(code);if(replay(s)===code&&!overfills(s,code.length))return s;}
  return code.split('').map(function(ch){return {act:'type',ch:ch};});
}

var guide = {code:null,back:null,pass:1,passes:2,steps:[],i:0,stage:'intro'};

function startGuide(code, back){
  guide.code=code; guide.back=back; guide.pass=1; guide.i=0; guide.stage='intro';
  guide.steps=dictation(code);
  renderGuide();
}

function renderGuide(){
  $('#list').hidden = true;
  var el = $('#detail'); el.hidden = false;
  var html;
  if (guide.stage==='intro') {
    html='<h2>Type it into a device</h2><section><ol>'+
      '<li>On the phone: <span class="tt">Settings → Screen Time</span>, and stop at the keypad.</li>'+
      '<li>One digit at a time. Type it, press Next, forget it.</li>'+
      '<li>Some digits are wrong on purpose and you will be told to delete — deletes take away right digits too.</li>'+
      '<li>iPhone asks twice; the second pass looks nothing like the first.</li></ol>'+
      '<div class="row"><button class="btn solid" id="go">I am at the keypad</button>'+
      '<button class="back" id="stop">Not now</button></div></section>';
  } else if (guide.stage==='between') {
    html='<h2>Once more</h2><section><p class="hint">The phone should be asking for it again to confirm. Get to that keypad — the digits come in a different order this time.</p>'+
      '<div class="row"><button class="btn solid" id="go">Ready</button><button class="back" id="stop">Stop</button></div></section>';
  } else if (guide.stage==='done') {
    html='<h2>Done</h2><section><p class="hint">That is the code typed in, without you ever seeing it whole. If the phone rejected it, run it again.</p>'+
      '<div class="row"><button class="btn solid" id="stop">Finished</button><button class="btn" id="again">Run it again</button></div></section>';
  } else {
    var st=guide.steps[guide.i], last=guide.i===guide.steps.length-1;
    html='<h2>Pass '+guide.pass+' of '+guide.passes+'</h2><section>'+
      '<p class="dial'+(st.act==='del'?' del':'')+'">'+(st.act==='del'?'⌫ delete':esc(st.ch))+'</p>'+
      '<p class="dial-label">'+(st.act==='del'?'Take the last digit back off':'Type this on the phone')+'</p>'+
      '<div class="row"><button class="btn solid" id="next">'+(last?'Done with this pass':'Next')+'</button>'+
      '<span class="hint" style="margin:0">or press <span class="tt">space</span></span></div>'+
      '<div class="track"><span style="width:'+Math.round((guide.i+1)/guide.steps.length*100)+'%"></span></div>'+
      '<div class="row"><button class="btn" id="restart">Start this pass over</button>'+
      '<button class="back" id="stop">Stop</button></div>'+
      '<p class="hint">Starting over means clearing every digit on the phone first.</p></section>';
  }
  el.innerHTML = html;
  var on=function(id,fn){var b=$('#'+id); if(b) b.addEventListener('click',fn);};
  on('go',function(){guide.stage='step';guide.i=0;renderGuide();});
  on('next',guideNext);
  on('restart',function(){guide.steps=dictation(guide.code);guide.i=0;renderGuide();});
  on('again',function(){startGuide(guide.code,guide.back);});
  on('stop',function(){guide.code=null;guide.back();});
}

function guideNext(){
  if(guide.stage!=='step')return;
  guide.i++;
  if(guide.i<guide.steps.length) return renderGuide();
  if(guide.pass<guide.passes){guide.pass++;guide.i=0;guide.steps=dictation(guide.code);guide.stage='between';return renderGuide();}
  guide.stage='done'; renderGuide();
}

document.addEventListener('keydown',function(ev){
  if(guide.code&&guide.stage==='step'&&(ev.key===' '||ev.key==='Enter')){ev.preventDefault();guideNext();}
});

/* ── gate ────────────────────────────────────────────────────── */

function start() {
  if (vault) { $('#gate').hidden = false; $('#pw').focus();
    if (vault.savedAt) $('#lede').textContent = 'Offline unlocker. Vault saved ' + stamp(vault.savedAt) + '. Everything needed to open it is in this one file — no internet, no website.';
  } else { $('#pick').hidden = false; $('#lede').textContent = 'Offline unlocker. Load a Keepsafe vault file and open it with its password — no internet, no website.'; }
}

$('#file').addEventListener('change', function (ev) {
  var f = ev.target.files && ev.target.files[0];
  if (!f) return;
  f.text().then(function (t) {
    try { vault = JSON.parse(t); } catch (e) { alert('That file is not readable.'); return; }
    if (!vault || !vault.kdf || !vault.data) { alert('That is not a Keepsafe vault file.'); vault = null; return; }
    $('#pick').hidden = true; $('#gate').hidden = false; $('#pw').focus();
  });
});

$('#gate').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var btn = $('#gate button'); btn.disabled = true; btn.textContent = 'Opening…';
  $('#gate-err').hidden = true;
  deriveKey($('#pw').value, unb64(vault.kdf.salt), vault.kdf.iterations)
    .then(function (k) { return openBlob(k, vault.data); })
    .then(function (json) {
      payload = JSON.parse(json);
      seen = payload.seen || 0;
      $('#gate').hidden = true; $('#pw').value = '';
      renderList();
      setInterval(tickClocks, 1000);
    })
    .catch(function () { $('#gate-err').hidden = false; })
    .then(function () { btn.disabled = false; btn.textContent = 'Open'; });
});

function renderList() {
  $('#detail').hidden = true;
  var el = $('#list'); el.hidden = false;
  var rows = (payload.entries || []).map(function (e, i) {
    var left = e.unlockAt ? e.unlockAt - now() : 0;
    var state = e.opened ? 'Open' : (left > 0 ? 'Locked' : (e.puzzle ? 'Puzzle' : 'Ready'));
    var meta = [];
    if (e.unlockAt) meta.push(left > 0 ? 'opens ' + stamp(e.unlockAt) : 'date passed');
    if (e.puzzle && !e.opened) meta.push(e.puzzle.rounds
      ? ((e.puzzle.done || 0) + '/' + e.puzzle.rounds + ' blocks counted') : 'counting puzzle');
    if (e.guide && !e.opened) meta.push('can be dictated');
    return '<li><span><span class="name">' + esc(e.label) + '</span>' +
      '<span class="meta">' + esc(meta.join('  ·  ')) + '</span></span>' +
      '<span><button class="btn" data-i="' + i + '">View</button> ' +
      '<span class="state">' + state + '</span></span></li>';
  }).join('');
  el.innerHTML = '<h2>Locked away</h2><ul>' + (rows || '<li><span class="meta">Nothing in this vault.</span></li>') + '</ul>' +
    '<p class="hint">This file is a snapshot. Solving a puzzle or running a walkthrough here changes nothing — the website keeps its own copy.</p>';
}

$('#list').addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-i]');
  if (b) renderEntry(Number(b.dataset.i));
});

function renderEntry(i) {
  var e = payload.entries[i];
  $('#list').hidden = true;
  var el = $('#detail'); el.hidden = false;
  var left = e.unlockAt ? e.unlockAt - now() : 0;
  var code = solved[i] || (e.opened ? e.secret : (left <= 0 && !e.puzzle ? e.secret : null));
  var html = '<h2>' + esc(e.label) + '</h2><section>';

  if (code) {
    html += '<h3>The code</h3><p class="code">' + esc(code) + '</p>';
  } else if (left > 0) {
    html += '<h3>Still locked</h3><p class="gauge" data-at="' + e.unlockAt + '">' + countdown(left) + '</p>' +
            '<p class="hint">until ' + esc(stamp(e.unlockAt)) + (e.puzzle ? ', then a ' + esc(e.puzzle.size) + ' counting puzzle' : '') + '</p>';
  } else if (e.puzzle && e.puzzle.body) {
    if (!runs[i]) runs[i] = {body:e.puzzle.body, salt:e.puzzle.salt, links:e.puzzle.links,
                             iv:e.puzzle.iv, ct:e.puzzle.ct, done:e.puzzle.done||0, rounds:e.puzzle.rounds||1};
    var r = runs[i];
    html += '<h3>Block ' + (r.done + 1) + ' of ' + r.rounds + '</h3>' +
      '<div class="track"><span style="width:' + Math.round(r.done / r.rounds * 100) + '%"></span></div>' +
      '<p class="hint" style="margin:14px 0 16px">A run of digits counts as one number. Each answer decrypts the next block; the last one decrypts the code.</p>' +
      '<pre>' + esc(r.body) + '</pre>' +
      '<form id="ans"><input id="n" type="number" min="0" inputmode="numeric" required placeholder="how many">' +
      '<div class="row"><button class="btn solid" type="submit">Next block</button></div></form>' +
      '<p class="hint" id="ans-note">Counting here does not save your place — this file is a snapshot.</p>';
  }

  var dictable = code || e.guide;
  if (dictable) {
    html += '</section><section><h3>Type it into a device</h3>' +
      '<div class="row"><button class="btn solid" id="dictate">Dictate it to me</button></div>' +
      '<p class="hint">One digit at a time, wrong digits mixed in, twice over for the confirmation screen.</p>';
  }

  html += '</section><div class="row"><button class="back" type="button" id="back">← everything else</button></div>';
  el.innerHTML = html;
  $('#back').addEventListener('click', renderList);

  var d = $('#dictate');
  if (d) d.addEventListener('click', function () {
    startGuide(code || e.guide, function () { renderEntry(i); });
  });

  var f = $('#ans');
  if (f) f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var note = $('#ans-note'); note.textContent = 'Checking…';
    var r = runs[i], chained = !!r.links;
    deriveKey($('#n').value.trim(), unb64(r.salt), chained ? 120000 : 600000)
      .then(function (k) { return openBlob(k, chained ? r.links[r.done] : r); })
      .then(function (out) {
        var link = chained ? JSON.parse(out) : { code: out };
        if (link.code === undefined) {
          r.body = link.body; r.salt = link.salt; r.done++;
          renderEntry(i);
        } else { solved[i] = link.code; renderEntry(i); }
      })
      .catch(function () { note.textContent = 'Not the right count for this block. Try again.'; });
  });
}

function tickClocks() {
  var g = document.querySelector('[data-at]');
  if (!g) return;
  var left = Number(g.dataset.at) - now();
  g.textContent = countdown(left);
}

start();
})();
</script>
</body>
</html>
